version: 1

indices:
  # Default site-wide index: one row per published page, exposed at
  # /query-index.json. Blocks can fetch this to build listings dynamically.
  default:
    include:
      - '/**'
    exclude:
      - '/drafts/**'
      - '/**/fragments/**'
    target: /query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: attribute(el, 'content')
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, 'content')
      lastModified:
        select: none
        value: parseTimestamp(headers('last-modified'), 'ddd, DD MMM YYYY hh:mm:ss GMT')
      robots:
        select: head > meta[name="robots"]
        value: attribute(el, 'content')

  # Leadership profiles: one row per leader page under /leaders/, feeding a
  # future query-index-driven profile block.
  leaders:
    # `/leaders/**` matches the folder page `/leaders` itself, so require a
    # child segment to index only the individual leader detail pages.
    include:
      - '/leaders/*'
    exclude:
      # belt-and-braces: keep the /leaders listing page out of the index
      - '/leaders'
    target: /leaders/query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, 'content')
      role:
        select: head > meta[name="role"]
        value: attribute(el, 'content')
      # image: the large portrait authored inside the profile-details block
      # (og:image is auto-derived from the first content image), used when a
      # block needs the full-size photo.
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, 'content')
      # thumbnail: a separate, smaller portrait authored as page metadata,
      # used for reportee cards where the big image is too large.
      thumbnail:
        select: head > meta[name="thumbnail"]
        value: attribute(el, 'content')
      # reportees: comma-separated list of leader page paths that report to
      # this person; lets a block reconstruct the full hierarchy for ordering.
      reportees:
        select: head > meta[name="reportees"]
        value: attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: attribute(el, 'content')

  # Clients: one row per client page under /clients/, feeding a future
  # query-index-driven client-cards block.
  clients:
    # require a child segment so the folder page `/clients` is not indexed
    include:
      - '/clients/*'
    exclude:
      - '/clients'
    target: /clients/query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, 'content')
      logo:
        select: head > meta[name="logo"]
        value: attribute(el, 'content')
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: attribute(el, 'content')

  # Success stories: one row per case-study page under /success-stories/,
  # feeding the query-index-driven success block. Cards link to these pages.
  success:
    # require a child segment so the folder page `/success-stories` is not indexed
    include:
      - '/success-stories/*'
    exclude:
      - '/success-stories'
    target: /success-stories/query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, 'content')
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: attribute(el, 'content')
      # tags: sourced from the `services` metadata (comma-separated), since
      # `tags` is a reserved metadata key. Exposed as the `tags` column.
      tags:
        select: head > meta[name="services"]
        value: attribute(el, 'content')

  # Events: one row per event detail page under /events/, feeding a
  # query-index-driven events listing/cards block. Cards link to these pages.
  events:
    # require a child segment so the folder page `/events` is not indexed
    include:
      - '/events/*'
    exclude:
      - '/events'
    target: /events/query-index.json
    properties:
      # event name (og:title is auto-derived from the page's first heading)
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: attribute(el, 'content')
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, 'content')
      # event calendar date, authored as page metadata (e.g. "2026-08-11")
      date:
        select: head > meta[name="date"]
        value: attribute(el, 'content')
      # start time, authored as page metadata (e.g. "9 AM IST")
      time:
        select: head > meta[name="time"]
        value: attribute(el, 'content')
      # headcount / community size, authored as page metadata (e.g. "500")
      attendees:
        select: head > meta[name="attendees"]
        value: attribute(el, 'content')
      # event length, authored as page metadata (e.g. "2 hours")
      duration:
        select: head > meta[name="duration"]
        value: attribute(el, 'content')